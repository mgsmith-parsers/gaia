name: Java Multi-OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }} using JDK 11
    # The matrix strategy creates parallel jobs for each combination defined below
    strategy:
      fail-fast: false # Prevents one OS failure from cancelling the other OS builds
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # Dynamically select the runner based on the current matrix iteration
    runs-on: ${{ matrix.os }}

    steps:
      # 1. Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Set up the specific Java version
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          java-version: '11'
          distribution: 'temurin' # Alternatives: zulu, corretto, microsoft
          cache: 'maven'          # Automatically caches dependencies to speed up builds (use 'gradle' if applicable)

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5

